name: px4-noetic-gazebo-multi-uav-formation
root: .

tmux_options: -f .tmux.conf
windows:
  - main:
      layout: main-horizontal
      panes:

        - . get_params.sh <%= @settings["scene"] %>;
          sleep 20;
          ./multi_uav_formation.sh <%= @settings["scene"] %> $UAV_NUM $LEADERS_NUM <%= @settings["run_prefix"] %> <%= @settings.fetch("planner", "ego") %> <%= @settings.fetch("enable_rviz", "false") %>


        - export DISABLE_ROS1_EOL_WARNINGS=1;
          roscore

        - . get_params.sh <%= @settings["scene"] %>;
          . ./setup_runtime_env.sh;
          until rostopic list >/dev/null 2>&1; do
            sleep 0.5;
          done;
          PACKAGE_DIR="$(rospack find multi_uav_formation)";
          WORLD_FILE="$PACKAGE_DIR/worlds/<%= @settings["scene"] %>.world";
          SCENE_FILE="$PACKAGE_DIR/scenes/<%= @settings["scene"] %>.json";
          if [ -f "$SCENE_FILE" ]; then
            python3 "$PACKAGE_DIR/scripts/generate_world_from_scene.py" --scene-file "$SCENE_FILE" --world-out "$WORLD_FILE";
          fi;
          if [ -f "$WORLD_FILE" ]; then
            roslaunch --wait multi_uav_formation multi_uav_mavros_sitl.launch world:="$WORLD_FILE" scene_file:="$SCENE_FILE" enable_moving_obstacles:="false" uav_count:="$UAV_NUM" uav1_start_x:="$UAV1_START_X" uav1_start_y:="$UAV1_START_Y" uav2_start_x:="$UAV2_START_X" uav2_start_y:="$UAV2_START_Y" uav3_start_x:="$UAV3_START_X" uav3_start_y:="$UAV3_START_Y" uav4_start_x:="$UAV4_START_X" uav4_start_y:="$UAV4_START_Y" uav5_start_x:="$UAV5_START_X" uav5_start_y:="$UAV5_START_Y";
          else
            roslaunch --wait multi_uav_formation multi_uav_mavros_sitl.launch;
          fi

<% if @settings.fetch("enable_rviz", "false").to_s.downcase == "true" %>
        - export DISABLE_ROS1_EOL_WARNINGS=1;
          sleep 3;
          until rostopic list >/dev/null 2>&1; do
            sleep 0.5;
          done;
          rviz -d visualize_obstacles.rviz
<% end %>

